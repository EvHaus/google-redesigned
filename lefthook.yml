colors: false

post-merge:
  commands:
    install:
      run: bun i

post-rebase:
  commands:
    install:
      run: bun i

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{css,json}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
